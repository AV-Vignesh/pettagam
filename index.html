<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pettagam — Document Locker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-route="vaults" aria-label="Vaults">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" class="ko"/><path d="M12 12v2.4" stroke="currentColor" stroke-width="1.6" class="ko"/></svg>
      <span>Vaults</span>
    </button>
    <button class="tab tab-add" data-route="add" aria-label="Add document">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="tab" data-route="ask" aria-label="Ask AI">
      <svg viewBox="0 0 24 24"><path d="M12 3c5 0 9 3.6 9 8s-4 8-9 8c-1 0-2-.1-2.9-.4L4 21l1.6-4C4 15.6 3 13.9 3 11c0-4.4 4-8 9-8z"/></svg>
      <span>Ask</span>
    </button>
    <button class="tab" data-route="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.8 3.5c0 .6-.05 1.1-.15 1.6l2 1.6-2 3.4-2.4-1c-.8.7-1.7 1.2-2.7 1.5L15 21h-4l-.55-2.4c-1-.3-1.9-.8-2.7-1.5l-2.4 1-2-3.4 2-1.6a8.6 8.6 0 0 1 0-3.2l-2-1.6 2-3.4 2.4 1c.8-.7 1.7-1.2 2.7-1.5L11 2h4l.55 2.4c1 .3 1.9.8 2.7 1.5l2.4-1 2 3.4-2 1.6c.1.5.15 1 .15 1.6z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
